<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESG Report Builder | ESG_Report_RTE</title>
    <meta name="description" content="Build annual ESG sustainability reports with the Syncfusion JavaScript (ES5) Rich Text Editor." />

    <!-- ============================================================
         Syncfusion EJ2 (Essential JS 2) - JavaScript ES5 global scripts
         Loaded from CDN in the exact dependency order documented at:
         https://ej2.syncfusion.com/documentation/rich-text-editor/getting-started
         Version: 34.2.2 (pinned)
    ============================================================= -->

    <!-- EJ2 theme styles (order mirrors the script dependency order) -->
    <link href="https://cdn.syncfusion.com/ej2/34.2.2/tailwind3.css" rel="stylesheet" />

    <!-- App styles -->
    <link href="css/styles.css" rel="stylesheet" />
</head>
<body class="app-shell">

    <!-- ===================== App header / action bar ===================== -->
    <header class="app-header" role="banner">
        <div class="app-title">
            <img src="assets/esg-logo.svg" alt="" width="28" height="28" class="app-logo" />
            <div>
                <h1>ESG Report Builder</h1>
                <p class="app-subtitle">Annual sustainability report &middot; Rich Text Editor (ES5) POC</p>
            </div>
        </div>

        <div class="app-actions" role="toolbar" aria-label="Report actions">
            <button id="btnCreateNew" type="button" class="btn btn-outline" title="Load the predefined ESG report template">
                + Create New Report
            </button>
            <button id="btnSaveDraft" type="button" class="btn btn-outline" title="Save the current draft in this browser">
                Save Draft
            </button>
            <button id="btnExportWord" type="button" class="btn btn-primary" title="Export the report as a Word document (.docx)">
                Export as Word
            </button>
            <button id="btnExportPdf" type="button" class="btn btn-primary" title="Export the report as a PDF document (.pdf)">
                Export as PDF
            </button>
        </div>
    </header>    <!-- ===================== Draft status strip ===================== -->
    <div id="draftStatus" class="draft-status" role="status" aria-live="polite">
        <span id="draftStatusText">Ready.</span>
        <span id="draftSavedAt" class="draft-saved-at"></span>
    </div>

    <!-- ===================== Main workspace ===================== -->
    <main class="workspace" role="main">

        <!-- Editor panel (Step 1-3: template, formatting, evidence) -->
        <section class="editor-panel" aria-label="Syncfusion Rich Text Editor">
            <div class="panel-heading">Syncfusion Rich Text Editor</div>
            <div id="esgEditor" class="esg-editor"></div>
        </section>

        <!-- Preview panel (Step 4: live document preview) -->
        <aside id="previewPanel" class="preview-panel" aria-label="Report preview">
            <div class="panel-heading">Live preview &middot; A4 layout</div>
            <div class="preview-scroll">
                <div id="previewPage" class="preview-page">
                    <!-- Report header band rendered by app.js -->
                    <div id="previewContent" class="preview-content">
                        <p class="preview-empty">Click <strong>Create New Report</strong> to load the ESG template.</p>
                    </div>
                </div>
            </div>
        </aside>

    </main>

    <!-- ===================== EJ2 scripts ==================================== -->
    <!--
      ES5 global build: each package captures `ej.*` namespaces at LOAD TIME,
      so packages must load AFTER every package they reference.
      base -> popups -> buttons -> splitbuttons -> inputs -> lists
      -> dropdowns -> navigations -> filemanager -> richtexteditor
    -->
    <script src="https://cdn.syncfusion.com/ej2/34.2.2/dist/ej2.min.js" type="text/javascript"></script>

    <!-- App scripts (order matters: config -> template -> storage -> app) -->
    <script src="js/config.js" type="text/javascript"></script>
    <script src="js/esg-template.js" type="text/javascript"></script>
    <script src="js/storage.js" type="text/javascript"></script>
    <script src="js/app.js" type="text/javascript"></script>

</body>
</html>
